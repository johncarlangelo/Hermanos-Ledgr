<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Neumorphic Modal Bottom Sheet</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-light-shadow": "#FFFFFF",
                        "surface-dark-shadow": "#BEBEBE",
                        "on-secondary-container": "#5e6572",
                        "on-tertiary-container": "#fffbff",
                        "tertiary-fixed-dim": "#ffb1c4",
                        "surface-container-lowest": "#ffffff",
                        "surface-container-highest": "#e2e2e5",
                        "background": "#F0F0F3",
                        "on-primary-fixed-variant": "#165127",
                        "inverse-primary": "#98d59d",
                        "surface": "#f9f9fc",
                        "text-charcoal": "#2D2D2D",
                        "surface-bright": "#f9f9fc",
                        "on-surface-variant": "#414940",
                        "on-error-container": "#93000a",
                        "error": "#ba1a1a",
                        "inverse-on-surface": "#f0f0f3",
                        "surface-container-low": "#f3f3f6",
                        "on-primary-container": "#f7fff3",
                        "secondary-fixed-dim": "#c0c7d6",
                        "on-primary-fixed": "#002109",
                        "on-primary": "#ffffff",
                        "secondary-container": "#dce2f3",
                        "on-secondary": "#ffffff",
                        "primary": "#2e673a",
                        "on-tertiary-fixed": "#3c051a",
                        "outline-variant": "#c0c9bd",
                        "error-container": "#ffdad6",
                        "surface-dim": "#d9dadd",
                        "inverse-surface": "#2f3133",
                        "tertiary-container": "#aa5d72",
                        "on-background": "#1a1c1e",
                        "on-tertiary-fixed-variant": "#733145",
                        "outline": "#71796f",
                        "surface-container-high": "#e8e8eb",
                        "tertiary-fixed": "#ffd9e0",
                        "surface-container": "#edeef1",
                        "tertiary": "#8c455a",
                        "on-secondary-fixed-variant": "#404754",
                        "on-error": "#ffffff",
                        "secondary-fixed": "#dce2f3",
                        "surface-variant": "#e2e2e5",
                        "surface-tint": "#316a3c",
                        "on-secondary-fixed": "#151c27",
                        "primary-fixed": "#b3f2b8",
                        "on-tertiary": "#ffffff",
                        "primary-fixed-dim": "#98d59d",
                        "primary-container": "#478151",
                        "on-surface": "#1a1c1e",
                        "secondary": "#585f6c"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "2xl": "1rem",
                        "3xl": "1.5rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "stack-lg": "24px",
                        "stack-sm": "8px",
                        "margin-mobile": "20px",
                        "base": "4px",
                        "gutter-md": "16px"
                    },
                    "fontFamily": {
                        "headline-lg": ["Plus Jakarta Sans"],
                        "body-lg": ["Plus Jakarta Sans"],
                        "body-md": ["Plus Jakarta Sans"],
                        "headline-lg-mobile": ["Plus Jakarta Sans"],
                        "headline-md": ["Plus Jakarta Sans"],
                        "label-caps": ["Plus Jakarta Sans"],
                        "numeric-lg": ["Plus Jakarta Sans"]
                    },
                    "fontSize": {
                        "headline-lg": ["28px", {"lineHeight": "36px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "500"}],
                        "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                        "headline-lg-mobile": ["24px", {"lineHeight": "32px", "fontWeight": "700"}],
                        "headline-md": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                        "label-caps": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700"}],
                        "numeric-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.03em", "fontWeight": "700"}]
                    }
                }
            }
        }
    </script>
<style>
        .neumorphic-extruded {
            box-shadow: -5px -5px 10px #FFFFFF, 5px 5px 10px #BEBEBE;
        }
        .neumorphic-sunken {
            box-shadow: inset 5px 5px 10px #BEBEBE, inset -5px -5px 10px #FFFFFF;
        }
        .neumorphic-extruded-soft {
             box-shadow: -3px -3px 6px #FFFFFF, 3px 3px 6px #BEBEBE;
        }
        
        /* Hide scrollbar for category selector */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-background min-h-screen flex items-end justify-center md:items-center p-4">
<!-- Modal Container -->
<div class="bg-background w-full max-w-md rounded-t-3xl md:rounded-3xl p-margin-mobile flex flex-col gap-gutter-md pb-[max(env(safe-area-inset-bottom),_20px)] transition-transform transform translate-y-0 relative z-10 neumorphic-extruded">
<!-- Drag Handle -->
<div class="w-12 h-1.5 bg-surface-dark-shadow/30 rounded-full mx-auto mb-stack-sm md:hidden"></div>
<!-- Top Segment Toggle -->
<div class="flex items-center justify-between bg-background p-1 rounded-2xl neumorphic-sunken">
<button class="flex-1 py-2 text-center rounded-xl font-label-caps text-label-caps text-primary bg-background neumorphic-extruded transition-all">Expense</button>
<button class="flex-1 py-2 text-center rounded-xl font-label-caps text-label-caps text-secondary hover:text-primary transition-colors">Income</button>
</div>
<!-- Amount Field -->
<div class="w-full h-24 bg-background rounded-2xl flex flex-col items-center justify-center neumorphic-sunken px-margin-mobile">
<span class="font-label-caps text-label-caps text-secondary mb-1">AMOUNT</span>
<input class="bg-transparent border-none text-center font-numeric-lg text-numeric-lg text-text-charcoal focus:ring-0 focus:outline-none w-full" readonly="" type="text" value="₱ 0.00">
</div>
<!-- Title Field -->
<div class="w-full h-14 bg-background rounded-xl flex items-center px-4 neumorphic-sunken">
<span class="material-symbols-outlined text-secondary mr-3 text-[20px]">edit</span>
<input class="bg-transparent border-none font-body-md text-body-md text-text-charcoal focus:ring-0 focus:outline-none w-full placeholder:text-secondary-fixed-dim" placeholder="What is this for?" type="text">
</div>
<!-- Category Selector -->
<div class="w-full flex gap-3 overflow-x-auto no-scrollbar py-2 px-1">
<button class="flex-shrink-0 px-4 py-2 rounded-full font-body-md text-body-md text-primary bg-background neumorphic-sunken">Food &amp; Drinks</button>
<button class="flex-shrink-0 px-4 py-2 rounded-full font-body-md text-body-md text-secondary bg-background neumorphic-extruded-soft hover:text-primary transition-colors">Transport</button>
<button class="flex-shrink-0 px-4 py-2 rounded-full font-body-md text-body-md text-secondary bg-background neumorphic-extruded-soft hover:text-primary transition-colors">Shopping</button>
<button class="flex-shrink-0 px-4 py-2 rounded-full font-body-md text-body-md text-secondary bg-background neumorphic-extruded-soft hover:text-primary transition-colors">Bills</button>
</div>
<!-- Note Field -->
<div class="w-full h-12 bg-background rounded-xl flex items-center px-4 neumorphic-sunken">
<span class="material-symbols-outlined text-secondary mr-3 text-[18px]">notes</span>
<input class="bg-transparent border-none font-body-md text-body-md text-text-charcoal focus:ring-0 focus:outline-none w-full placeholder:text-secondary-fixed-dim" placeholder="Add a note (optional)" type="text">
</div>
<!-- Divider -->
<div class="w-full h-px bg-surface-dark-shadow/20 my-2"></div>
<!-- Quick Channels Grid -->
<h3 class="font-headline-md text-headline-md text-text-charcoal mb-1">Quick Add</h3>
<div class="grid grid-cols-2 gap-gutter-md mb-stack-lg">
<button class="flex items-center gap-3 p-3 rounded-xl bg-background neumorphic-extruded hover:opacity-80 active:neumorphic-sunken transition-all">
<div class="w-10 h-10 rounded-full flex items-center justify-center neumorphic-sunken text-primary">
<span class="material-symbols-outlined">local_cafe</span>
</div>
<span class="font-body-md text-body-md text-text-charcoal truncate">Coffee Run</span>
</button>
<button class="flex items-center gap-3 p-3 rounded-xl bg-background neumorphic-extruded hover:opacity-80 active:neumorphic-sunken transition-all">
<div class="w-10 h-10 rounded-full flex items-center justify-center neumorphic-sunken text-tertiary">
<span class="material-symbols-outlined">restaurant</span>
</div>
<span class="font-body-md text-body-md text-text-charcoal truncate">Dining</span>
</button>
<button class="flex items-center gap-3 p-3 rounded-xl bg-background neumorphic-extruded hover:opacity-80 active:neumorphic-sunken transition-all">
<div class="w-10 h-10 rounded-full flex items-center justify-center neumorphic-sunken text-[#3b82f6]"> <!-- Using distinct blue for E-wallet, bypassing generic tailwind ban for specific brand-like utility -->
<span class="material-symbols-outlined">account_balance_wallet</span>
</div>
<span class="font-body-md text-body-md text-text-charcoal truncate">E-Wallet Out</span>
</button>
<button class="flex items-center gap-3 p-3 rounded-xl bg-background neumorphic-extruded hover:opacity-80 active:neumorphic-sunken transition-all">
<div class="w-10 h-10 rounded-full flex items-center justify-center neumorphic-sunken text-[#eab308]">
<span class="material-symbols-outlined">smartphone</span>
</div>
<span class="font-body-md text-body-md text-text-charcoal truncate">E-Load</span>
</button>
<button class="flex items-center gap-3 p-3 rounded-xl bg-background neumorphic-extruded hover:opacity-80 active:neumorphic-sunken transition-all">
<div class="w-10 h-10 rounded-full flex items-center justify-center neumorphic-sunken text-[#1ed760]">
<span class="material-symbols-outlined">graphic_eq</span>
</div>
<span class="font-body-md text-body-md text-text-charcoal truncate">Spotify</span>
</button>
<button class="flex items-center gap-3 p-3 rounded-xl bg-background neumorphic-extruded hover:opacity-80 active:neumorphic-sunken transition-all">
<div class="w-10 h-10 rounded-full flex items-center justify-center neumorphic-sunken text-[#e50914]">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">play_arrow</span>
</div>
<span class="font-body-md text-body-md text-text-charcoal truncate">Netflix</span>
</button>
<button class="flex items-center gap-3 p-3 rounded-xl bg-background neumorphic-extruded hover:opacity-80 active:neumorphic-sunken transition-all"><div class="w-10 h-10 rounded-full flex items-center justify-center neumorphic-sunken text-secondary"><span class="material-symbols-outlined">add_circle</span></div><span class="font-body-md text-body-md text-text-charcoal truncate">Other Sources</span></button></div>
<!-- Footer Button -->
<button class="w-full h-14 rounded-2xl bg-background flex items-center justify-center neumorphic-extruded font-headline-md text-headline-md text-primary active:neumorphic-sunken transition-all mt-auto">
            Save Record
        </button>
</div>
<!-- Backdrop for realism (optional, helps isolate the modal) -->
<div class="fixed inset-0 bg-text-charcoal/5 z-0 pointer-events-none"></div>


</body></html>
