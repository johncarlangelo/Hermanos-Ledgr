<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Neumorphic Bottom Sheet</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<style type="text/tailwindcss">
    @layer utilities {
      .shadow-extruded {
        box-shadow: -5px -5px 10px #FFFFFF, 5px 5px 10px #BEBEBE;
      }
      .shadow-sunken {
        box-shadow: inset 5px 5px 10px #BEBEBE, inset -5px -5px 10px #FFFFFF;
      }
      .shadow-sunken-sm {
        box-shadow: inset 3px 3px 6px #BEBEBE, inset -3px -3px 6px #FFFFFF;
      }
    }
  </style>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          "colors": {
                  "surface-light-shadow": "#FFFFFF",
                  "surface-dark-shadow": "#BEBEBE",
                  "on-secondary-container": "#5e6572",
                  "on-tertiary-container": "#fffbff",
                  "tertiary-fixed-dim": "#ffb1c4",
                  "surface-container-lowest": "#ffffff",
                  "surface-container-highest": "#e2e2e5",
                  "background": "#F0F0F3",
                  "on-primary-fixed-variant": "#165127",
                  "inverse-primary": "#98d59d",
                  "surface": "#f9f9fc",
                  "text-charcoal": "#2D2D2D",
                  "surface-bright": "#f9f9fc",
                  "on-surface-variant": "#414940",
                  "on-error-container": "#93000a",
                  "error": "#ba1a1a",
                  "inverse-on-surface": "#f0f0f3",
                  "surface-container-low": "#f3f3f6",
                  "on-primary-container": "#f7fff3",
                  "secondary-fixed-dim": "#c0c7d6",
                  "on-primary-fixed": "#002109",
                  "on-primary": "#ffffff",
                  "secondary-container": "#dce2f3",
                  "on-secondary": "#ffffff",
                  "primary": "#2e673a",
                  "on-tertiary-fixed": "#3c051a",
                  "outline-variant": "#c0c9bd",
                  "error-container": "#ffdad6",
                  "surface-dim": "#d9dadd",
                  "inverse-surface": "#2f3133",
                  "tertiary-container": "#aa5d72",
                  "on-background": "#1a1c1e",
                  "on-tertiary-fixed-variant": "#733145",
                  "outline": "#71796f",
                  "surface-container-high": "#e8e8eb",
                  "tertiary-fixed": "#ffd9e0",
                  "surface-container": "#edeef1",
                  "tertiary": "#8c455a",
                  "on-secondary-fixed-variant": "#404754",
                  "on-error": "#ffffff",
                  "secondary-fixed": "#dce2f3",
                  "surface-variant": "#e2e2e5",
                  "surface-tint": "#316a3c",
                  "on-secondary-fixed": "#151c27",
                  "primary-fixed": "#b3f2b8",
                  "on-tertiary": "#ffffff",
                  "primary-fixed-dim": "#98d59d",
                  "primary-container": "#478151",
                  "on-surface": "#1a1c1e",
                  "secondary": "#585f6c"
          },
          "borderRadius": {
                  "DEFAULT": "0.25rem",
                  "lg": "0.5rem",
                  "xl": "0.75rem",
                  "2xl": "1.25rem",
                  "full": "9999px"
          },
          "spacing": {
                  "stack-lg": "24px",
                  "stack-sm": "8px",
                  "margin-mobile": "20px",
                  "base": "4px",
                  "gutter-md": "16px"
          },
          "fontFamily": {
                  "headline-lg": [
                          "Plus Jakarta Sans"
                  ],
                  "body-lg": [
                          "Plus Jakarta Sans"
                  ],
                  "body-md": [
                          "Plus Jakarta Sans"
                  ],
                  "headline-lg-mobile": [
                          "Plus Jakarta Sans"
                  ],
                  "headline-md": [
                          "Plus Jakarta Sans"
                  ],
                  "label-caps": [
                          "Plus Jakarta Sans"
                  ],
                  "numeric-lg": [
                          "Plus Jakarta Sans"
                  ]
          },
          "fontSize": {
                  "headline-lg": [
                          "28px",
                          {
                                  "lineHeight": "36px",
                                  "letterSpacing": "-0.02em",
                                  "fontWeight": "700"
                          }
                  ],
                  "body-lg": [
                          "16px",
                          {
                                  "lineHeight": "24px",
                                  "fontWeight": "500"
                          }
                  ],
                  "body-md": [
                          "14px",
                          {
                                  "lineHeight": "20px",
                                  "fontWeight": "400"
                          }
                  ],
                  "headline-lg-mobile": [
                          "24px",
                          {
                                  "lineHeight": "32px",
                                  "fontWeight": "700"
                          }
                  ],
                  "headline-md": [
                          "20px",
                          {
                                  "lineHeight": "28px",
                                  "fontWeight": "600"
                          }
                  ],
                  "label-caps": [
                          "12px",
                          {
                                  "lineHeight": "16px",
                                  "letterSpacing": "0.05em",
                                  "fontWeight": "700"
                          }
                  ],
                  "numeric-lg": [
                          "32px",
                          {
                                  "lineHeight": "40px",
                                  "letterSpacing": "-0.03em",
                                  "fontWeight": "700"
                          }
                  ]
          }
        },
      }
    }
  </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface-dark-shadow min-h-screen flex items-end justify-center font-body-md text-text-charcoal antialiased p-4">
<!-- Mobile Container simulating a device screen area -->
<div class="relative w-full max-w-md bg-background rounded-t-[32px] rounded-b-[32px] overflow-hidden shadow-2xl h-[751px] flex flex-col">
<!-- Drag Handle -->
<div class="w-full flex justify-center pt-4 pb-2">
<div class="w-12 h-1.5 bg-surface-dark-shadow rounded-full opacity-50"></div>
</div>
<!-- Scrollable Content -->
<div class="flex-1 overflow-y-auto px-margin-mobile pb-[100px] space-y-stack-lg">
<!-- Top Segment Toggle -->
<div class="flex p-1 bg-background shadow-sunken rounded-full">
<button class="flex-1 py-2 px-4 rounded-full font-label-caps text-label-caps text-secondary text-center transition-all">Expense</button>
<button class="flex-1 py-2 px-4 rounded-full font-label-caps text-label-caps text-primary shadow-extruded bg-background text-center transition-all">Income</button>
</div>
<!-- Amount Field -->
<div class="w-full bg-background shadow-sunken rounded-2xl p-6 flex flex-col items-center justify-center">
<span class="font-label-caps text-label-caps text-secondary mb-1">Amount</span>
<input class="bg-transparent border-none text-center font-numeric-lg text-numeric-lg text-text-charcoal focus:ring-0 p-0 w-full" readonly="" type="text" value="₱ 0.00">
</div>
<!-- Form Fields -->
<div class="space-y-gutter-md">
<!-- Title Field -->
<div class="w-full bg-background shadow-sunken rounded-xl px-4 py-3">
<input class="bg-transparent border-none w-full font-body-md text-body-md text-text-charcoal placeholder-secondary focus:ring-0 p-0" placeholder="What is this for?" type="text">
</div>
<!-- Note Field -->
<div class="w-full bg-background shadow-sunken rounded-xl px-4 py-3">
<input class="bg-transparent border-none w-full font-body-md text-body-md text-text-charcoal placeholder-secondary focus:ring-0 p-0" placeholder="Add a note (optional)" type="text">
</div>
</div>
<!-- Bottom Half (Channel Grid - Income state) -->
<div>
<h3 class="font-body-lg text-body-lg text-secondary mb-gutter-md px-1">Source</h3>
<div class="grid grid-cols-2 gap-gutter-md">
<!-- Button 1 -->
<button class="flex items-center space-x-3 p-4 bg-background shadow-extruded rounded-xl active:shadow-sunken transition-all duration-200">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">payments</span>
<span class="font-body-md text-body-md text-text-charcoal text-left leading-tight">Sent to Me</span>
</button>
<!-- Button 2 -->
<button class="flex items-center space-x-3 p-4 bg-background shadow-extruded rounded-xl active:shadow-sunken transition-all duration-200">
<span class="material-symbols-outlined text-blue-500" style="font-variation-settings: 'FILL' 1;">account_balance_wallet</span>
<span class="font-body-md text-body-md text-text-charcoal text-left leading-tight">GCash Transfer</span>
</button>
<!-- Button 3 -->
<button class="flex items-center space-x-3 p-4 bg-background shadow-extruded rounded-xl active:shadow-sunken transition-all duration-200">
<span class="material-symbols-outlined text-green-500" style="font-variation-settings: 'FILL' 1;">wallet</span>
<span class="font-body-md text-body-md text-text-charcoal text-left leading-tight">Maya Transfer</span>
</button>
<!-- Button 4 -->
<button class="flex items-center space-x-3 p-4 bg-background shadow-extruded rounded-xl active:shadow-sunken transition-all duration-200">
<span class="material-symbols-outlined text-orange-500" style="font-variation-settings: 'FILL' 1;">account_balance</span>
<span class="font-body-md text-body-md text-text-charcoal text-left leading-tight">MariBank Transfer</span>
</button>
<!-- Button 5 -->
<button class="flex items-center space-x-3 p-4 bg-background shadow-extruded rounded-xl active:shadow-sunken transition-all duration-200">
<span class="material-symbols-outlined text-text-charcoal" style="font-variation-settings: 'FILL' 1;">account_balance</span>
<span class="font-body-md text-body-md text-text-charcoal text-left leading-tight">Bank Transfer</span>
</button>
<!-- Button 6 -->
<button class="flex items-center space-x-3 p-4 bg-background shadow-extruded rounded-xl active:shadow-sunken transition-all duration-200">
<span class="material-symbols-outlined text-secondary" style="font-variation-settings: 'FILL' 1;">add_circle</span>
<span class="font-body-md text-body-md text-text-charcoal text-left leading-tight">Other Sources</span>
</button>
</div>
</div>
</div>
<!-- Fixed Footer -->
<div class="absolute bottom-0 w-full p-margin-mobile bg-background">
<button class="w-full bg-background text-primary font-headline-md text-headline-md py-4 rounded-xl shadow-extruded active:shadow-sunken transition-all duration-200 flex justify-center items-center">
        Save Record
      </button>
</div>
</div>
</body></html>
